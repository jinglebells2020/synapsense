; SynapSense - wrist-worn seizure detection prototype
; Board: Seeed XIAO nRF52840 Sense, Arduino framework (Adafruit nRF52 core)

[platformio]
default_envs = xiao

[env:xiao]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-afruitnrf52-nrf52840-sense
framework = arduino
monitor_speed = 115200
build_flags = -O2
test_ignore = *

; Host build of the detector only (no Arduino), for unit tests on the Mac:
;   pio test -e native
[env:native]
platform = native
build_flags = -std=c++17 -Wall -Wextra
build_src_filter = -<*>
test_framework = unity
